spring:
  application:
    name: backend-engineering-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jpalab}
    username: ${DB_USERNAME:jpalab}
    password: ${DB_PASSWORD:jpalab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

logging:
  level:
    org.hibernate.SQL: debug
